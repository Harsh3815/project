<!DOCTYPE html>
<html>
<head>
    <title>Luxury Jewelry</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <style>
        /* PALMONAS STYLE CSS */
        body {
            background-color: #fcfaf7 !important; /* Soft cream background */
            font-family: "Georgia", serif;
            color: #1a1a1a;
        }
        
        .navbar {
            background-color: #0a1128 !important; /* Deep Navy Header */
            padding: 20px 0;
        }

        .navbar-brand {
            font-size: 2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff !important;
        }

        .product-card {
            border: none;
            background: #ffffff;
            transition: transform 0.3s;
            text-align: center;
            padding: 15px;
            margin-bottom: 30px;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-title {
            font-size: 1.1rem;
            margin-top: 15px;
            font-weight: 400;
            text-transform: uppercase;
        }

        .btn-luxury {
            background-color: #0a1128;
            color: white;
            border-radius: 0; /* Square buttons like Palmonas */
            padding: 10px 25px;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container justify-content-center">
            <a class="navbar-brand" href="#">Palmonas Inspired</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center mb-5" style="letter-spacing: 3px;">OUR COLLECTION</h2>
        <div class="row">
            {% for product in products %}
            <div class="col-md-4">
                <div class="product-card shadow-sm">
                    <img src="{{ product.img }}" class="img-fluid" alt="Jewelry">
                    <div class="product-title">{{ product.name }}</div>
                    <p class="text-muted">{{ product.price }}</p>
                    <button class="btn btn-luxury">ADD TO CART</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
